<div *ngIf="market && stalls" class="container py-4">
  <div class="card mb-4 text-center">
    <div class="card-body">
      <h4 class="card-title">{{ market.name }}</h4>
      <p class="card-text text-muted">{{ market.location }}</p>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let stall of stalls">
      <div class="card h-100 shadow-sm border-0">
        <img [src]="stall.imageUrl" class="card-img-top" alt="{{ stall.name }}"/>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ stall.name }}</h5>
          <h5 class="card-subtitle">{{ stall.schedule }}</h5>
          <p class="card-text flex-grow-1">{{ stall.description }}</p>
          <a class="btn btn-primary mt-auto">
            {{ 'stalls.order' | translate }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
