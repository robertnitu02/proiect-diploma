<div class="container py-4">
  <div class="row row-cols-1 row-cols-md-2 g-4 mb-5">
    <div class="col" *ngFor="let market of markets">
      <div class="card shadow-sm rounded-4 overflow-hidden h-100">
        <img src="{{market.imageUrl}}"
             alt="{{market.name}}"
             class="card-img-top object-fit-cover market-image"/>
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h4 class="card-title fw-bold mb-2">
              {{ market.name }}
              <span class="text-muted fs-6">– {{ market.location }}</span>
            </h4>
            <p class="card-text mb-3">{{ market.description }}</p>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-auto">
            <a class="btn btn-outline-primary px-4 rounded-pill"
               (click)="goToMarketStalls(market.id ?? 0)">
              {{ 'markets.to-stalls' | translate }}
            </a>
            <small class="text-muted">
              {{ 'markets.schedule' | translate }}: {{ market.schedule }}
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isAdmin" class="card shadow border-0 rounded-4 p-4 mx-auto admin-container">
    <h3 class="text-center mb-4">{{ 'markets.create-market' | translate }}</h3>
    <hr class="mb-4">

    <div class="mb-3">
      <label for="marketName" class="form-label">{{ 'markets.name' | translate }}</label>
      <input [(ngModel)]="marketData.name"
             name="marketName"
             type="text"
             class="form-control rounded-3"
             id="marketName">
    </div>

    <div class="mb-3">
      <label for="marketLocation" class="form-label">{{ 'markets.location' | translate }}</label>
      <input [(ngModel)]="marketData.location"
             name="marketLocation"
             type="text"
             class="form-control rounded-3"
             id="marketLocation">
    </div>

    <div class="mb-3">
      <label for="marketDescription" class="form-label">{{ 'markets.description' | translate }}</label>
      <textarea [(ngModel)]="marketData.description"
                name="marketDescription"
                class="form-control rounded-3"
                id="marketDescription"
                rows="3">
      </textarea>
    </div>

    <div class="mb-3">
      <label for="marketSchedule" class="form-label">{{ 'markets.schedule' | translate }}</label>
      <input [(ngModel)]="marketData.schedule"
             name="marketSchedule"
             type="text"
             class="form-control rounded-3"
             id="marketSchedule"
             placeholder="ex: 08:00 - 16:00">
    </div>

    <div class="mb-3">
      <label for="marketImageUrl" class="form-label">{{ 'markets.image-url' | translate }}</label>
      <input [(ngModel)]="marketData.imageUrl"
             name="marketImageUrl"
             type="url"
             class="form-control rounded-3"
             id="marketImageUrl">
    </div>

    <div class="text-center mb-4" *ngIf="marketData.imageUrl">
      <img src="{{marketData.imageUrl}}"
           alt="Image preview"
           class="rounded-circle shadow-sm market-image-preview">
      <p class="small text-muted mt-2">{{ 'markets.image-preview' | translate }}</p>
    </div>

    <div class="mb-3">
      <label for="ownerId" class="form-label">{{ 'markets.owner-id' | translate }}</label>
      <input [(ngModel)]="marketData.ownerId"
             name="ownerId"
             type="text"
             class="form-control rounded-3"
             id="ownerId">
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit"
              class="btn btn-success px-4 py-2 rounded-pill shadow-sm"
              (click)="createMarket()">
        <i class="fas fa-plus-circle me-2"></i> {{ 'markets.add-market' | translate }}
      </button>
    </div>
  </div>
</div>
