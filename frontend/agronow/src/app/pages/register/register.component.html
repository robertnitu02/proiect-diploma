<div class="container py-5">
  <div class="card shadow-lg border-0 rounded-4 p-4 mx-auto" style="max-width: 600px;">
    <h3 class="text-center mb-3">{{ 'login-and-register.register' | translate }}</h3>
    <hr class="mb-4">

    <div *ngIf="errorMessages.length > 0" class="alert alert-danger">
      <ul class="mb-0">
        <li *ngFor="let message of errorMessages">{{ message }}</li>
      </ul>
    </div>

    <div class="mb-3">
      <label for="firstName" class="form-label">{{ 'login-and-register.first-name' | translate }}</label>
      <input [(ngModel)]="registerRequest.firstName"
             type="text"
             class="form-control rounded-3"
             id="firstName"
             placeholder="{{ 'login-and-register.first-name' | translate }}">
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label">{{ 'login-and-register.last-name' | translate }}</label>
      <input [(ngModel)]="registerRequest.lastName"
             type="text"
             class="form-control rounded-3"
             id="lastName"
             placeholder="{{ 'login-and-register.last-name' | translate }}">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input [(ngModel)]="registerRequest.email"
             type="email"
             class="form-control rounded-3"
             id="email"
             placeholder="name@example.com">
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">{{ 'login-and-register.password' | translate }}</label>
      <input [(ngModel)]="registerRequest.password"
             type="password"
             class="form-control rounded-3"
             id="password"
             placeholder="{{ 'login-and-register.password' | translate }}">
    </div>

    <div class="d-flex justify-content-between">
      <button *ngIf="!isAlreadyLoggedIn()"
              (click)="register()"
              type="button"
              class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
        <i class="fas fa-user-plus me-2"></i> {{ 'login-and-register.register' | translate }}
      </button>

      <button (click)="goToLogin()" type="button" class="btn btn-outline-secondary px-4 py-2 rounded-pill">
        {{ 'login-and-register.back-to-login' | translate }}
      </button>
    </div>
  </div>
</div>
